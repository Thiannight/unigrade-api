<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unigrade · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --color-primary: #2563eb;
            --color-primary-hover: #1d4ed8;
            --color-gray-50: #f8fafc;
            --color-gray-100: #f1f5f9;
            --color-gray-200: #e2e8f0;
            --color-gray-300: #cbd5e1;
            --color-gray-500: #64748b;
            --color-gray-600: #475569;
            --color-gray-700: #334155;
            --color-gray-800: #1e293b;
            --color-gray-900: #0f172a;
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --radius: 12px;
            --radius-sm: 8px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--color-gray-50);
            color: var(--color-gray-800);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 2.5rem 2rem;
        }

        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--color-gray-900);
            margin-bottom: 0.25rem;
        }

        .login-card .subtitle {
            font-size: 0.85rem;
            color: var(--color-gray-500);
            margin-bottom: 1.75rem;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-gray-600);
            margin-bottom: 0.4rem;
        }

        .field input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1.5px solid var(--color-gray-200);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--color-gray-800);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: var(--color-primary);
            color: #fff;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background: var(--color-primary-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.30);
        }

        .error {
            display: none;
            margin-top: 1rem;
            padding: 0.7rem 0.9rem;
            font-size: 0.85rem;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Unigrade</h1>
        <p class="subtitle">Sign in to access the API</p>

        <form id="loginForm">
            <div class="field">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn">Sign in</button>
            <div id="error" class="error"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error');
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, password: password })
                });

                if (!response.ok) {
                    throw new Error('Invalid credentials');
                }

                const data = await response.json();
                document.cookie = 'token=' + data.accessToken + '; path=/';
                window.location.href = '/promotions/view';
            } catch (error) {
                errorBox.textContent = error.message || 'Login failed';
                errorBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
