<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Unigrade - Promotions</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; color: #1f2933; }
    h1 { margin-bottom: 1.5rem; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid #e0e0e0; }
    th { background-color: #f5f7fa; font-weight: 600; }
    tr:hover { background-color: #fafafa; }
    .empty { color: #6b7280; font-style: italic; padding: 1rem 0; }
    button {
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Promotions</h1>

  <table th:if="${not #lists.isEmpty(promotions)}">
    <thead>
      <tr>
        <th>Référence</th>
        <th>Période</th>
        <th>Diplômés</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="promotion : ${promotions}">
        <td th:text="${promotion.reference}">REF</td>
        <td th:text="${promotion.startYear} + ' - ' + ${promotion.endYear}">2020 - 2023</td>
        <td>
          <a th:href="@{'/promotions/' + ${promotion.id} + '/graduates.xlsx'}">
            <button type="button">Télécharger la liste des diplômés</button>
          </a>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="empty" th:if="${#lists.isEmpty(promotions)}">Aucune promotion enregistrée.</p>
</body>
</html>
